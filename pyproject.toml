[project]
name = "agent-suite-estimator"
version = "0.1.0"
description = "Local agent-suite LLM budget planner"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "litellm>=1.80,<2",
  "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
